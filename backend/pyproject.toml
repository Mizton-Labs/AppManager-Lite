[project]
name = "appmanager-lite"
version = "0.1.0"
description = "AppManager Lite portal backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    # Direct floor to clear Starlette advisories pulled in transitively via
    # FastAPI (CVE-2025-54121, CVE-2025-62727, PYSEC-2026-161).
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.30,<0.35",
    "argon2-cffi>=23.1,<24",
    "authlib>=1.3,<2",
    "python3-saml>=1.16,<2",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.7,<3",
    # Used directly for per-user Ed25519 SSH keypair generation (app.sshkeys);
    # previously only a transitive dependency of authlib/python3-saml.
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<0.29",
]

[tool.uv]
package = false
